apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-demo
  labels:
    app.kubernetes.io/name: argo-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argo-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argo-demo
    spec:
      # Give in-flight requests time to finish before the pod dies.
      # Without this, every rolling update drops requests.
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: app
          # The tag is the ONLY thing CI changes. Overlays patch it.
          image: ghcr.io/oliveryang/argo-demo-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ENV_NAME
              value: base
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
