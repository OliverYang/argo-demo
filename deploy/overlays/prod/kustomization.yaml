apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo-demo-prod

resources:
- ../../base

# In a real setup prod would be pinned to an immutable git SHA tag, never
# `latest`. CI writes that tag here on release. Keeping the same mechanism
# as dev is the point: only the VALUE differs between environments.
images:
- name: ghcr.io/oliveryang/argo-demo-app
  newTag: 713cbd6

replicas:
- count: 3
  name: argo-demo

patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/0/value
      value: prod
  target:
    kind: Deployment
    name: argo-demo
